[package]
name = "wtf"
version = "0.1.0"
description = "Local voice-to-text dictation"
edition = "2021"

[features]
default = ["asr"]
# Production build: embed the frontend dist into the binary. Without this
# (plain `cargo build --release`) the binary starts in dev mode and tries to
# load http://localhost:5173 -> "Connection refused" in the window.
prod = ["tauri/custom-protocol"]
# ASR backend (whisper.cpp). CPU-only unless a GPU backend feature is added.
asr = ["dep:whisper-rs"]
asr-cuda = ["asr", "whisper-rs/cuda"]
asr-vulkan = ["asr", "whisper-rs/vulkan", "dep:ash"]

[lib]
name = "wtf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
# Exit early when a second instance is launched (Plasma session restore
# relaunches the app at login alongside the systemd user unit).
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ashpd = { version = "0.13", features = ["global_shortcuts", "notification"] }
cpal = "0.16"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# HTTP is only used for model downloads from huggingface.co; tokio::fs for
# streaming the response body to disk on the tauri runtime.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
# Update check: installed model files are hashed (sha256) and compared with
# the huggingface tree API.
sha2 = "0.10"
tokio = { version = "1", features = ["fs"] }
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "6"
whisper-rs = { version = "0.16", optional = true }
ash = { version = "0.38.0", features = ["loaded"], optional = true }
# GigaAM engine: ONNX Runtime (CPU EP). Pinned pre-release: a floating caret
# would silently pull 2.0.0 finals with a different API. Default features
# include `download-binaries` (prebuilt libonnxruntime fetched at build time).
ort = "=2.0.0-rc.13"
# Qwen3-ASR engine: STFT for its log-mel front end (the model files carry no
# preprocessor graph, unlike GigaAM's).
rustfft = "6"

[profile.release]
strip = true
lto = true
